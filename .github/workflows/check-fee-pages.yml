name: Check official fee pages

on:
  schedule:
    - cron: "15 1 * * 1"   # Every Monday 09:15 Taipei time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official source pages
        run: python scripts/check_updates.py
      - name: Commit source status when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_status.json
          git diff --cached --quiet || git commit -m "chore: weekly fee source check"
          git push
