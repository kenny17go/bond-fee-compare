<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1f33">
  <title>收費總表｜海外債券平台</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="topnav">
      <div>
        <div class="eyebrow">Bond Fee Compare Taiwan</div>
        <h1>11 家平台收費總表</h1>
        <p>完整查看申購、賣出、持有、內含費用與官方來源。</p>
      </div>
      <nav>
        <a href="./index.html">首頁</a>
        <a href="./compare.html">費用分類比較</a>
        <a class="active" href="./master.html">收費總表</a>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="section-title">
      <div>
        <h2>完整 Master Table</h2>
        <p>可左右滑動查看所有欄位。</p>
      </div>
      <input id="filter" placeholder="搜尋平台…" />
    </div>
    <div class="table-wrap">
      <table class="master-table">
        <thead>
          <tr>
            <th>平台</th><th>類型</th><th>申購/買入</th><th>賣出/贖回</th>
            <th>持有費</th><th>內含費用</th><th>是否內含成交價</th>
            <th>線上交易</th><th>最低交易額</th><th>可試算</th>
            <th>透明度</th><th>資料狀態</th><th>資料日期</th><th>官方來源</th><th>備註</th>
          </tr>
        </thead>
        <tbody id="masterBody"></tbody>
      </table>
    </div>
  </section>
</main>

<footer><div class="wrap">11 家海外債券平台收費 Master Table</div></footer>
<script src="./master.js"></script>
</body>
</html>
